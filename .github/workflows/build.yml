name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 2.0.0)'
        required: false
        default: 'dev'

jobs:
  build_windows_qt:
    name: Windows (Qt, MinGW)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.11.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          install-deps: 'true'

      - name: Install MinGW
        uses: egor-tensin/setup-mingw@v2
        with:
          version: '13.2.0'
          platform: x64

      - name: Configure CMake
        run: cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j8

      - name: Package
        shell: powershell
        run: |
          $env:QT_DIR = "${{ env.Qt6_DIR }}"
          powershell -ExecutionPolicy Bypass -File package.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipBridge_Windows_Qt
          path: ClipBridge_Qt_*.zip

  build_windows_win32:
    name: Windows (Win32 API)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout win32 branch
        run: |
          git fetch origin win32
          git checkout win32

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release -j8

      - name: Package
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File package.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipBridge_Windows_Win32
          path: ClipBridge_Win32_*.zip

  build_macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.11.1'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

      - name: Build
        run: cmake --build build -j8

      - name: Create app bundle and dmg
        run: |
          # Create .app bundle
          mkdir -p ClipBridge.app/Contents/MacOS
          mkdir -p ClipBridge.app/Contents/Resources
          cp build/ClipBridge ClipBridge.app/Contents/MacOS/
          cp config.json ClipBridge.app/Contents/Resources/

          # Use macdeployqt
          macdeployqt ClipBridge.app

          # Create dmg
          hdiutil create -volname ClipBridge -srcfolder ClipBridge.app -ov -format UDZO ClipBridge_macOS.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipBridge_macOS
          path: ClipBridge_macOS.zip

  build_linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgl1-mesa-dev libx11-dev libxtst-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.11.1'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

      - name: Build
        run: cmake --build build -j8

      - name: Create AppImage
        run: |
          # Create AppDir structure
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # Copy files
          cp build/ClipBridge AppDir/usr/bin/
          cp config.json AppDir/usr/bin/

          # Create desktop file
          cat > AppDir/ClipBridge.desktop << 'EOF'
          [Desktop Entry]
          Name=ClipBridge
          Exec=ClipBridge
          Icon=ClipBridge
          Type=Application
          Comment=Cross-platform clipboard tool
          Categories=Utility;
          EOF

          # Download linuxdeployqt
          wget -c "https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage" -O linuxdeployqt
          chmod +x linuxdeployqt

          # Build AppImage
          ./linuxdeployqt AppDir/usr/bin/ClipBridge -appimage -verbose=2

          # Rename
          mv ClipBridge-*.AppImage ClipBridge_Linux.AppImage
          zip ClipBridge_Linux.zip ClipBridge_Linux.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipBridge_Linux
          path: ClipBridge_Linux.zip

  create_release:
    name: Create Release
    needs: [build_windows_qt, build_windows_win32, build_macos, build_linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Display downloaded files
        run: ls -la

      - name: Get version
        id: get_version
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            VERSION=${VERSION#v}
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            ClipBridge_Windows_Qt/ClipBridge_Qt_*.zip
            ClipBridge_Windows_Win32/ClipBridge_Win32_*.zip
            ClipBridge_macOS/ClipBridge_macOS.zip
            ClipBridge_Linux/ClipBridge_Linux.zip
          tag_name: ${{ steps.get_version.outputs.VERSION && format('v{0}', steps.get_version.outputs.VERSION) || github.ref_name }}
          name: Release ${{ steps.get_version.outputs.VERSION || github.ref_name }}
          draft: false
          prerelease: false
