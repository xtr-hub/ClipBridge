name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: false
        default: 'dev'

jobs:
  build_windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw81'

      - name: Set up MinGW
        uses: egor-tensin/setup-mingw@v2
        with:
          version: '11.2.0'
          platform: x64

      - name: Configure CMake
        run: cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j8

      - name: Package
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File package.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipBridge_Windows
          path: ClipBridge_Windows_*.zip

  build_macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          dir: ${{ github.workspace }}/Qt

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build -j8

      - name: Package
        run: |
          # Read version from CMakeLists.txt
          VERSION=$(sed -n 's/project(ClipBridge VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ -z "$VERSION" ]; then
            VERSION=$(date +%Y%m%d)
          fi

          # Create App bundle structure
          APP_DIR=ClipBridge.app
          rm -rf $APP_DIR
          mkdir -p $APP_DIR/Contents/MacOS
          mkdir -p $APP_DIR/Contents/Resources

          # Copy executable and resources
          cp build/ClipBridge $APP_DIR/Contents/MacOS/
          cp config.json $APP_DIR/Contents/Resources/
          cp README.md $APP_DIR/Contents/Resources/
          if [ -f LICENSE ]; then
            cp LICENSE $APP_DIR/Contents/Resources/
          fi

          # Use macdeployqt to copy Qt frameworks
          if [ -d "$Qt5_DIR/bin/macdeployqt" ]; then
            $Qt5_DIR/bin/macdeployqt $APP_DIR
          elif [ -d "$Qt5_DIR/bin/macdeployqt.app" ]; then
            $Qt5_DIR/bin/macdeployqt.app/Contents/MacOS/macdeployqt $APP_DIR
          else
            # Try to find macdeployqt in Qt5_DIR
            if [ -n "$Qt5_DIR" ]; then
              if [ -f "$Qt5_DIR/bin/macdeployqt" ]; then
                "$Qt5_DIR/bin/macdeployqt" $APP_DIR
              elif [ -f "$Qt5_DIR/bin/macdeployqt.app/Contents/MacOS/macdeployqt" ]; then
                "$Qt5_DIR/bin/macdeployqt.app/Contents/MacOS/macdeployqt" $APP_DIR
              else
                # Look for macdeployqt in common places
                if [ -f "/usr/local/Qt5/bin/macdeployqt" ]; then
                  /usr/local/Qt5/bin/macdeployqt $APP_DIR
                elif [ -f "/usr/local/opt/qt5/bin/macdeployqt" ]; then
                  /usr/local/opt/qt5/bin/macdeployqt $APP_DIR
                else
                  echo "WARNING: macdeployqt not found, attempting to manually copy frameworks"
                  # Manual copy is complex, just zip the app without it as a fallback
                fi
              fi
            fi
          fi

          # Create zip
          ZIP_NAME=ClipBridge_macOS_${VERSION}.zip
          rm -f $ZIP_NAME
          ditto -c -k --sequesterRsrc --keepParent $APP_DIR $ZIP_NAME
          echo "Created $ZIP_NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipBridge_macOS
          path: ClipBridge_macOS_*.zip

  create_release:
    name: Create Release
    needs: [build_windows, build_macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Display downloaded files
        run: ls -la

      - name: Get version
        id: get_version
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            VERSION=${VERSION#v}
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            ClipBridge_Windows/ClipBridge_Windows_*.zip
            ClipBridge_macOS/ClipBridge_macOS_*.zip
          tag_name: ${{ steps.get_version.outputs.VERSION && format('v{0}', steps.get_version.outputs.VERSION) || github.ref_name }}
          name: Release ${{ steps.get_version.outputs.VERSION || github.ref_name }}
          draft: false
          prerelease: false
