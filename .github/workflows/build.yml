name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: false
        default: 'dev'

jobs:
  build_windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw81'

      - name: Set up MinGW
        uses: egor-tensin/setup-mingw@v2
        with:
          version: '11.2.0'
          platform: x64

      - name: Configure CMake
        run: cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j8

      - name: Package
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/package/package.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipBridge_Windows
          path: ClipBridge_Windows_*.zip

  build_macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          dir: ${{ github.workspace }}/Qt

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64"

      - name: Build
        run: cmake --build build -j8

      - name: Package
        run: |
          ./scripts/package/package_macos.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipBridge_macOS
          path: ClipBridge_macOS_*.zip

  create_release:
    name: Create Release
    needs: [build_windows, build_macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Display downloaded files
        run: ls -la

      - name: Get version
        id: get_version
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            VERSION=${VERSION#v}
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            ClipBridge_Windows/ClipBridge_Windows_*.zip
            ClipBridge_macOS/ClipBridge_macOS_*.zip
          tag_name: ${{ steps.get_version.outputs.VERSION && format('v{0}', steps.get_version.outputs.VERSION) || github.ref_name }}
          name: Release ${{ steps.get_version.outputs.VERSION || github.ref_name }}
          draft: false
          prerelease: false
